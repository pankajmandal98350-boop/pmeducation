<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Education Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f1f5f9; padding: 20px 15px; }
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        h2 { color: #115286; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; color: white; background: #16a34a; font-weight: bold; cursor: pointer; }
        .btn-blue { background: #115286; }
    </style>
</head>
<body>

    <!-- 1. Add Paid Class -->
    <div class="box">
        <h2><i class="fas fa-laptop"></i> Add Paid Class</h2>
        <input type="text" id="paidClassName" placeholder="Class Name">
        <input type="text" id="paidClassLink" placeholder="Class Link">
        <button onclick="uploadClass('paid_classes', 'paidClassName', 'paidClassLink')">Add Paid Class</button>
    </div>

    <!-- 2. Add Free Course -->
    <div class="box">
        <h2><i class="fas fa-video"></i> Add Free Course</h2>
        <input type="text" id="freeClassName" placeholder="Course Name">
        <input type="text" id="freeClassLink" placeholder="Video Link">
        <button onclick="uploadClass('free_classes', 'freeClassName', 'freeClassLink')">Add Free Course</button>
    </div>

    <!-- 3. Add Test -->
    <div class="box">
        <h2><i class="fas fa-edit"></i> Add Test</h2>
        <select id="testType">
            <option value="free_tests">Free Test</option>
            <option value="paid_tests">Paid Test Series</option>
        </select>
        <input type="text" id="testName" placeholder="Test Name">
        <input type="text" id="testLink" placeholder="Google Form Link">
        <button onclick="uploadTest()">Add Test</button>
    </div>

    <!-- 4. Upload Material -->
    <div class="box">
        <h2><i class="fas fa-file-pdf"></i> Upload Material</h2>
        <select id="materialType">
            <option value="pdf_notes">PDF Notes</option>
            <option value="ebooks">E-Books</option>
            <option value="syllabus">Syllabus</option>
        </select>
        <input type="text" id="materialTitle" placeholder="Material Title">
        <input type="text" id="materialLink" placeholder="Drive Link">
        <button onclick="uploadMaterial()">Upload Material</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjmLUMLS2B4ZhRoxhM2QnHClBvLDqtSbc",
            authDomain: "pm-education-88289.firebaseapp.com",
            databaseURL: "https://pm-education-88289-default-rtdb.firebaseio.com",
            projectId: "pm-education-88289",
            storageBucket: "pm-education-88289.firebasestorage.app",
            messagingSenderId: "598427015572",
            appId: "1:598427015572:web:f27269e9aacbd2c3d01781"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function uploadClass(dbRef, nameId, linkId) {
            const name = document.getElementById(nameId).value;
            const link = document.getElementById(linkId).value;
            if(!name || !link) return alert("Sab bharein!");
            db.ref(dbRef).push({ title: name, url: link }).then(() => {
                alert("Success!");
                document.getElementById(nameId).value = '';
                document.getElementById(linkId).value = '';
            });
        }

        function uploadTest() {
            const type = document.getElementById('testType').value;
            const name = document.getElementById('testName').value;
            const link = document.getElementById('testLink').value;
            if(!name || !link) return alert("Sab bharein!");
            db.ref(type).push({ title: name, url: link }).then(() => {
                alert("Success!");
                document.getElementById('testName').value = '';
                document.getElementById('testLink').value = '';
            });
        }

        function uploadMaterial() {
            const type = document.getElementById('materialType').value;
            const title = document.getElementById('materialTitle').value;
            const link = document.getElementById('materialLink').value;
            if(!title || !link) return alert("Sab bharein!");
            db.ref(type).push({ title: title, url: link }).then(() => {
                alert("Success!");
                document.getElementById('materialTitle').value = '';
                document.getElementById('materialLink').value = '';
            });
        }
    </script>
</body>
</html>
